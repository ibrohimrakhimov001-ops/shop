<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Android Kokand</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--acc:#15803D;--acc2:#166534;--ink:#1B2326;--mut:#5C676B;--line:#E5EAE7;--soft:#F2F5F3;--grad:linear-gradient(135deg,#178A45,#14532D)}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#E6F5EA 0,#fff 300px) no-repeat;min-height:100vh}
button,input{font-family:inherit}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 10px}
.brand{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--acc)}
.sub{font-size:12px;font-weight:700;color:var(--acc2)}
.search{display:flex;gap:8px;margin:2px 20px 14px}
.search label{display:flex;align-items:center;gap:10px;flex:1;height:52px;padding:0 16px;border-radius:16px;background:#fff;border:2px solid var(--acc);box-shadow:0 6px 18px rgba(21,128,61,.15)}
.search input{border:none;background:transparent;font-size:15px;font-weight:600;color:var(--ink);flex:1;min-width:0;outline:none}
.viewport{overflow:hidden;margin:0 20px;border-radius:22px;touch-action:pan-y}
.slides{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1);will-change:transform}
.slides .banner{flex:none;width:100%;margin:0}
.banner{position:relative;height:156px;margin:0 20px;border-radius:22px;overflow:hidden;color:#fff;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;transition:background .5s}
.banner .tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:rgba(255,255,255,.2);padding:4px 8px;border-radius:6px}
.banner .t{font-size:21px;font-weight:800;line-height:1.15;max-width:230px;margin-top:6px}
.banner .more{font-size:13px;font-weight:700;opacity:.9}
.banner svg.deco{position:absolute;right:-10px;bottom:-14px;opacity:.18}
.dots{display:flex;justify-content:center;gap:6px;padding-top:10px}
.dots button{height:8px;border-radius:4px;border:none;padding:0;transition:all .3s}
.cats{display:flex;gap:8px;padding:12px 20px 4px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{padding:9px 15px;border-radius:12px;border:none;background:var(--soft);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap;min-height:38px}
.cats button.on{background:var(--acc);color:#fff;font-weight:700}
.cats button.sale{background:#FDECEC;color:#B91C1C;font-weight:700}
.cats button.sale.on{background:#DC2626;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:10px 20px 24px}
.card{background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(21,128,61,.07);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);cursor:pointer;text-align:left}
.ph{position:relative;height:128px;border-radius:12px;background:linear-gradient(160deg,#F2F8F4,#DCEFE2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:#DC2626;color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px}
.card .n{font-size:14px;font-weight:700;line-height:1.2}
.card .s{font-size:12px;color:var(--mut);font-weight:600}
.card .p{font-size:16px;font-weight:800;margin-top:auto}
.old{font-size:12px;color:var(--mut);text-decoration:line-through;margin-left:6px;font-weight:600}
.card.sold{opacity:.6}.card.sold img{filter:grayscale(1)}
.soldtag{position:absolute;inset:auto 8px 8px 8px;background:rgba(27,35,38,.85);color:#fff;font-size:12px;font-weight:800;text-align:center;padding:5px;border-radius:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0;font-weight:600}
/* product */
.gal{position:relative;height:340px;background:linear-gradient(160deg,#F2F8F4,#D6EDDD);display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.back{position:fixed;top:16px;left:16px;width:44px;height:44px;border-radius:14px;background:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.08);z-index:5}
.pbody{display:flex;flex-direction:column;gap:14px;padding:18px 20px 24px;min-height:calc(var(--tg-viewport-stable-height,100vh) - 340px - 90px)}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.15}
.big{font-size:30px;font-weight:800;color:var(--acc)}
.specs{background:var(--soft);border-radius:18px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #E0E7E2;font-size:15px}
.row:last-child{border-bottom:none}
.ic{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.row .k{color:var(--mut);font-weight:600;flex:1}.row .v{font-weight:800}
.calc{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:18px;padding:14px}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.terms button{height:44px;border-radius:12px;border:2px solid #fff;background:#fff;color:var(--ink);font-weight:800;font-size:14px}
.terms button.on{border-color:var(--acc);color:var(--acc2)}
.res{display:flex;align-items:center;justify-content:space-between;background:var(--grad);color:#fff;border-radius:12px;padding:10px 14px}
.desc{white-space:pre-wrap;font-size:14px;line-height:1.5;color:var(--mut);font-weight:600}
.bar{position:sticky;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;width:100%;margin-top:auto}
.bar a{white-space:nowrap;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;text-decoration:none}
.bar .call{background:var(--grad);color:#fff}
.bar .tg{background:#fff;border:2px solid var(--acc);color:var(--acc)}
.soldbig{background:#1B2326;color:#fff;font-weight:800;text-align:center;padding:12px;border-radius:14px;font-size:16px}
/* tabbar, filiallar, kalkulyator */
#app{min-height:100vh;display:flex;flex-direction:column}
.tabbar{position:sticky;bottom:0;z-index:10;margin-top:auto;display:flex;justify-content:space-around;padding:10px 12px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;font-size:11px;font-weight:600;color:var(--mut);min-width:64px;padding:2px 0}
.tabbar button.on{color:var(--acc);font-weight:700}
.brsel{position:relative;align-self:flex-start;display:flex;align-items:center;gap:4px;height:28px;font-size:12px;font-weight:700;color:var(--acc2)}
.brsel select{position:absolute;inset:0;opacity:0;font-size:16px}
.fbtn{width:52px;height:52px;border-radius:16px;border:none;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none}
.sortrow{display:flex;gap:6px;margin:-4px 20px 12px;flex-wrap:wrap}
.sortrow button{height:36px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink)}
.sortrow button.on{border-color:var(--acc);color:var(--acc2);background:#E3F1E8}
.card .br{font-size:11px;color:var(--acc2);font-weight:700}
.fromm{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:14px;background:#E3F1E8;color:var(--acc2);text-decoration:none;border:none;text-align:left;width:100%}
.fromm .go{display:flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:10px;background:var(--grad);color:#fff;font-size:13px;font-weight:800;flex:none}
.loc{display:flex;align-items:flex-start;gap:12px;padding:4px 2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:#fff;border-radius:12px}
.seg button{height:38px;border-radius:9px;border:none;background:transparent;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--grad);color:#fff;font-weight:800}
.terms button.dis{color:#A3ADA9}
.down{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:#fff;padding:0 12px;font-size:13px;font-weight:600;color:var(--mut)}
.down input{flex:1;min-width:0;border:none;outline:none;background:transparent;text-align:right;font-size:15px;font-weight:700;color:var(--ink)}
.warn{display:flex;gap:8px;align-items:flex-start;background:#FFF4E5;color:#92400E;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.35}
.warn button{border:none;background:#92400E;color:#fff;border-radius:8px;height:32px;padding:0 10px;font-weight:800;font-size:12px;flex:none}
.bcard{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(21,128,61,.06)}
.bhead{display:flex;align-items:center;gap:10px}
.bnum{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.binfo{display:grid;grid-template-columns:74px minmax(0,1fr);gap:6px 8px;font-size:13px;font-weight:700;background:var(--soft);border-radius:12px;padding:10px 12px}
.binfo span:nth-child(odd){color:var(--mut);font-weight:600}
.bacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bacts a{height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:14px;text-decoration:none}
.bacts .c{background:var(--grad);color:#fff}.bacts .t{border:2px solid var(--acc);color:var(--acc)}
.list{display:flex;flex-direction:column;gap:10px;padding:4px 20px 24px}
.newbox{display:flex;flex-direction:column;gap:12px;margin:8px 20px 24px;padding:16px;border-radius:18px;background:#fff;border:2px dashed #CBD5CF}
.newbox h3{margin:0;font-size:17px;font-weight:800}
.newbox button.go{height:54px;border-radius:14px;border:none;background:var(--grad);color:#fff;font-weight:800;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 20px 24px}
.tiles button{height:110px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,#F2F8F4,#DCEFE2);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:14px;gap:2px;text-align:left;color:var(--ink)}
.tiles b{font-size:17px;font-weight:800}.tiles span{font-size:12px;font-weight:600;color:var(--mut)}
/* admin */
.adm{width:44px;height:44px;border-radius:14px;background:#1B2326;border:none;display:flex;align-items:center;justify-content:center;flex:none}
.top{display:flex;align-items:center;gap:12px;padding:20px 20px 12px}
.top h2{margin:0;font-size:22px;font-weight:800;flex:1}
.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 20px 12px;height:52px;border-radius:16px;border:none;background:var(--grad);color:#fff;font-weight:800;font-size:15px;width:calc(100% - 40px)}
.alist{display:flex;flex-direction:column;gap:10px;padding:0 20px 30px}
.aitem{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}
.aitem .th{width:56px;height:56px;border-radius:12px;background:linear-gradient(160deg,#F2F8F4,#DCEFE2);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.aitem .th img{width:100%;height:100%;object-fit:cover}
.aitem .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.aitem .info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem .info span{font-size:12px;color:var(--mut);font-weight:600}
.acts{display:flex;gap:6px}
.acts button{width:40px;height:40px;border-radius:12px;border:none;background:var(--soft);display:flex;align-items:center;justify-content:center}
.acts .s.on{background:#1B2326}
.form{display:flex;flex-direction:column;gap:12px;padding:0 20px 120px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--mut)}
.fl input{height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:15px;font-weight:600;color:var(--ink);outline:none}
.fl input:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
.fl input{width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:38px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink)}
.chips button.on{border-color:var(--acc);color:var(--acc2);background:#E3F1E8}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phs .ph2{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft)}
.phs .ph2 img{width:100%;height:100%;object-fit:cover}
.phs .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:8px;border:none;background:rgba(27,35,38,.8);color:#fff;font-weight:800}
.phs label{aspect-ratio:1;border-radius:12px;border:2px dashed #BFD9C8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--acc);font-size:12px;font-weight:700;cursor:pointer}
.save{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);max-width:560px;margin:0 auto}
.save button{width:100%;height:54px;border-radius:16px;border:none;background:var(--grad);color:#fff;font-weight:800;font-size:16px}
.save button:disabled{opacity:.6}
.toast{position:fixed;left:20px;right:20px;bottom:96px;background:#1B2326;color:#fff;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px;z-index:20;text-align:center}
</style>
</head><body>
<div class="wrap" id="app"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#E6F5EA'); }
const API = 'https://api.github.com/repos/ibrohimrakhimov001-ops/shop/contents/products.json';
const RAW = 'https://raw.githubusercontent.com/ibrohimrakhimov001-ops/shop/main/';
const RATES = {3: 15, 6: 20, 12: 38};   // BIRZUM NASIYA: narx*1.02, +15/20/38 %
const BANNERS = [
  {tag:'Aksiya', t:'iPhone’larga chegirmalar', bg:'linear-gradient(135deg,#22A55A,#14532D)'},
  {tag:'Kafolat', t:'Har bir telefonga kafolat beramiz', bg:'linear-gradient(135deg,#178A45,#0B3D24)'},
  {tag:'Muddatli to‘lov', t:'3, 6 va 12 oyga bo‘lib to‘lang', bg:'linear-gradient(135deg,#15803D,#052E16)'}
];
let D = {products: [], kurs: 12800}, cat = 'all', q = '', bi = 0, term = 12, rasmiy = false, down = 0, warn = false, brf = '', sort = 'new', showSort = false;
const BR = () => D.branches || [];
const brName = id => (BR().find(b => String(b.id) === String(id)) || {}).name || '';
// ISHONCH: narx × kurs × 1.01, bosh to‘lov ayiriladi, qoldiq × koeffitsient / oy
const ISH = {rasmiy: {3: 1.27, 6: 1.36, 12: 1.42}, norasmiy: {12: 1.5}};
const TABS = [['home', 'Bosh sahifa', '<path d="M3 11l9-7 9 7v9H3z"></path>'],
  ['catalog', 'Katalog', '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect>'],
  ['sale', 'Aksiyalar', '<path d="M19 5L5 19"></path><circle cx="7" cy="7" r="2.5"></circle><circle cx="17" cy="17" r="2.5"></circle>'],
  ['contact', 'Aloqa', '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"></path>']];
const tabbar = on => `<nav class="tabbar" aria-label="Menyu">${TABS.map(([k, l, ic]) => `<button data-tab="${k}" class="${k === on ? 'on' : ''}" ${k === on ? 'aria-current="page"' : ''}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic}</svg>${l}</button>`).join('')}</nav>`;
function tabEvents() { document.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { location.hash = el.dataset.tab === 'home' ? '' : el.dataset.tab; }); tg && tg.BackButton.hide(); window.scrollTo(0, 0); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const up = n => Math.ceil(n / 1000) * 1000;
const priceSum = p => p.price * D.kurs * 1.01;
const monthly = (p, m, r = rasmiy, d = down) => up(Math.max(0, priceSum(p) - d) * ISH[r ? 'rasmiy' : 'norasmiy'][m] / m);
const img = (p, i = 0) => p.photos && p.photos[i] ? RAW + p.photos[i] : '';
const phoneSvg = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="1.6" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>';

async function getData() {
  try {
    const r = await fetch(API, {headers: {Accept: 'application/vnd.github.raw'}, cache: 'no-store'});
    if (r.ok) return await r.json();
  } catch (e) {}
  const r = await fetch('products.json?t=' + Date.now(), {cache: 'no-store'});
  return await r.json();
}

function brandOf(n) {
  n = n.toLowerCase();
  if (n.includes('iphone')) return 'iPhone';
  if (n.includes('samsung') || n.includes('galaxy')) return 'Samsung';
  if (/xiaomi|redmi|poco/.test(n)) return 'Xiaomi';
  return 'Boshqa';
}

function home() {
  const list = D.products.filter(p => p.id)
    .filter(p => cat === 'all' || (cat === 'sale' ? p.sale : brandOf(p.name) === cat))
    .filter(p => !q || (p.name + ' ' + (p.memory || '')).toLowerCase().includes(q))
    .filter(p => !brf || String(p.branch) === String(brf))
    .sort((a, b) => (!!a.sold - !!b.sold) || (sort === 'cheap' ? (a.price || 1e9) - (b.price || 1e9) : sort === 'exp' ? (b.price || 0) - (a.price || 0) : b.id - a.id));
  const brands = [...new Set(D.products.filter(p => p.id).map(p => brandOf(p.name)))];
  $('#app').innerHTML = `
  <header><div style="display:flex;flex-direction:column">
    ${BR().length ? `<label class="brsel">${esc(brf ? brName(brf) : 'Barcha filiallar')}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      <select id="brf" aria-label="Filialni tanlash"><option value="">Barcha filiallar</option>${BR().map(b => `<option value="${b.id}" ${String(b.id) === String(brf) ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></label>` : '<div class="sub">Qo‘qon · telefonlar do‘koni</div>'}
    <div class="brand">Android Kokand</div></div>
  ${ADMIN ? `<button class="adm" aria-label="Admin panel" onclick="location.hash='admin'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg></button>` : ''}</header>
  <div class="search"><label><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input id="q" aria-label="Qidirish" placeholder="iPhone 13, Samsung A55..." value="${esc(q)}"></label>
    <button class="fbtn" id="fb" aria-label="Saralash" aria-expanded="${showSort}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button></div>

function dots() { document.querySelectorAll('[data-b]').forEach((el, k) => { el.style.width = (k === bi ? 22 : 8) + 'px'; el.style.background = k === bi ? '#15803D' : '#CBD5CF'; }); }
let lastTouch = 0;
function slide(k, auto) {
  const sl = $('#slides'); if (!sl) return;
  if (auto && Date.now() - lastTouch < 6000) return;   // не листать сразу после свайпа
  if (!auto) lastTouch = Date.now();
  bi = k; sl.style.transform = `translateX(${-k * 100}%)`; dots();
}

function toast(t, ms = 2200) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), ms); }

async function apiUrl(force) {
  if (APIURL && !force) return APIURL;
  const r = await fetch(API.replace('products.json', 'api.json'), {headers: {Accept: 'application/vnd.github.raw'}, cache: 'no-store'});
  APIURL = (await r.json()).api; return APIURL;
}
async function call(path, body, retry = true) {
  try {
    const r = await fetch(await apiUrl() + path, {method: body ? 'POST' : 'GET', headers: {'X-Init-Data': INIT, 'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
  } catch (e) {
    if (retry) { await apiUrl(true); return call(path, body, false); }   // туннель мог смениться
    throw e;
  }
}
async function refresh() { try { D = await getData(); D.products = (D.products || []).filter(p => p.id); } catch (e) {} }

function shrink(file, max = 1280) {   // сжатие фото в браузере: ≤1280 px, JPEG 0.82
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src); ok(c.toDataURL('image/jpeg', 0.82)); };
    im.onerror = bad; im.src = URL.createObjectURL(file); });
}

async function saveForm(id) {
  const f = form.f;
  if (!f.name || !String(f.name).trim()) return toast('Model nomini yozing');
  if (!id && !form.neu.length) return toast('Kamida 1 ta rasm qo‘shing');
  const b = $('#sv'); b.disabled = true; b.textContent = 'Saqlanmoqda…';
  try {
    const fields = {}; ['name', 'memory', 'state', 'battery', 'box', 'warranty', 'price', 'old', 'sale', 'branch'].forEach(k => fields[k] = f[k] ?? '');
    const j = await call('/api/save', {id: id ? +id : null, fields, keep: form.keep, new_photos: form.neu});
    toast(id ? '✅ Saqlandi' : '✅ Saqlandi va kanalga joylandi'); j.warn && toast(j.warn, 4000);
    form = null; setTimeout(async () => { await refresh(); location.hash = 'admin'; adminList(); }, 1500);
  } catch (e) { b.disabled = false; b.textContent = 'Qayta urinish'; toast('Xato: ' + e.message, 4000); }
}

function settings() {
  if (!ADMIN) { location.hash = ''; return; }
  $('#app').innerHTML = `
  <div class="top">${back('admin')}<h2>Sozlamalar</h2></div>
  <div class="form">
    <label class="fl">Dollar kursi, so‘m<input id="s_kurs" type="number" inputmode="numeric" value="${D.kurs || ''}"></label>
    <label class="fl">Telefon raqam<input id="s_phone" type="tel" placeholder="+998 90 123 45 67" value="${esc(D.phone || '')}"></label>
    <label class="fl">Telegram username<input id="s_tg" placeholder="android_kokand" value="${esc(D.tg || '')}"></label>
  </div>
  <div class="save"><button id="sv">Saqlash</button></div>`;
  $('#sv').onclick = async () => {
    const body = {kurs: $('#s_kurs').value, phone: $('#s_phone').value, tg: $('#s_tg').value};
    try { await call('/api/settings', body); Object.assign(D, body, {kurs: +body.kurs}); toast('✅ Saqlandi'); }
    catch (e) { toast('Xato: ' + e.message, 4000); }
  };
}

/* ================= KATALOG / AKSIYALAR / ALOQA ================= */
const head = t => `<div class="top"><h2>${t}</h2></div>`;
function catalog() {
  const live = D.products.filter(p => !p.sold), groups = {};
  live.forEach(p => { const b = brandOf(p.name); groups[b] = (groups[b] || 0) + 1; });
  $('#app').innerHTML = `${head('Katalog')}
  <div class="tiles">${Object.entries(groups).map(([b, n]) => `<button data-cat="${b}"><b>${b}</b><span>${n} ta telefon</span></button>`).join('') || '<div class="empty">Hozircha telefonlar yo‘q</div>'}</div>
  ${tabbar('catalog')}`;
  document.querySelectorAll('[data-cat]').forEach(el => el.onclick = () => { cat = el.dataset.cat; location.hash = ''; });
  tabEvents();
}
function sales() {
  const list = D.products.filter(p => p.sale && !p.sold);
  $('#app').innerHTML = `${head('Aksiya va chegirmalar')}
  <div class="grid">${list.length ? list.map(card).join('') : '<div class="empty">Hozircha aksiyalar yo‘q</div>'}</div>
  ${tabbar('sale')}`;
  document.querySelectorAll('[data-p]').forEach(el => el.onclick = () => { location.hash = 'p=' + el.dataset.p; });
  tabEvents();
}
function contact() {
  const list = BR().length ? BR() : [{name: 'Android Kokand', phone: D.phone, tg: D.tg}];
  $('#app').innerHTML = `${head('Filiallar va aloqa')}
  <div class="list">${list.map((b, i) => {
    const ph = (b.phone || '').replace(/[^\d+]/g, ''), t = (b.tg || '').replace(/^@/, '');
    const n = D.products.filter(p => !p.sold && String(p.branch) === String(b.id)).length;
    return `<div class="bcard"><div class="bhead"><span class="bnum">${i + 1}</span><div style="display:flex;flex-direction:column;flex:1;min-width:0"><span style="font-size:15px;font-weight:800">${esc(b.name)}</span>${b.id ? `<span style="font-size:12px;font-weight:600;color:var(--mut)">${n} ta telefon</span>` : ''}</div></div>
    <div class="binfo">${b.addr ? `<span>Manzil</span><span>${esc(b.addr)}</span>` : ''}${b.phone ? `<span>Telefon</span><span>${esc(b.phone)}</span>` : ''}${t ? `<span>Telegram</span><span>@${esc(t)}</span>` : ''}${b.hours ? `<span>Ish vaqti</span><span>${esc(b.hours)}</span>` : ''}</div>
    <div class="bacts">${ph ? `<a class="c" href="tel:${ph}">Qo‘ng‘iroq</a>` : ''}${t ? `<a class="t" href="https://t.me/${esc(t)}">Telegram</a>` : ''}</div></div>`;
  }).join('')}</div>
  ${tabbar('contact')}`;
  tabEvents();
}

/* ================= ADMIN: FILIALLAR ================= */
const BF = [['name', 'Nomi', 'Masalan: Markaz filiali', 'text'], ['addr', 'Manzil', 'Qo‘qon shahar, ...', 'text'], ['phone', 'Telefon raqami', '+998 __ ___ __ __', 'tel'], ['tg', 'Telegram', '@username', 'text'], ['hours', 'Ish vaqti', 'Har kuni 9:00–21:00', 'text']];
let bEdit = null;
function branchesAdmin() {
  if (!ADMIN) { location.hash = ''; return; }
  const cur = bEdit ? BR().find(b => b.id === bEdit) || {} : {};
  $('#app').innerHTML = `<div class="top">${back('admin')}<h2>Filiallar</h2></div>
  <div class="list">${BR().map((b, i) => `<div class="bcard"><div class="bhead"><span class="bnum">${i + 1}</span>
    <div style="display:flex;flex-direction:column;flex:1;min-width:0"><span style="font-size:15px;font-weight:800">${esc(b.name)}</span><span style="font-size:12px;font-weight:600;color:var(--mut)">${D.products.filter(p => String(p.branch) === String(b.id)).length} ta telefon</span></div>
    <div class="acts"><button aria-label="Tahrirlash" data-be="${b.id}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
    <button aria-label="O‘chirish" data-bd="${b.id}" style="background:#FDECEC"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button></div></div>
    <div class="binfo"><span>Manzil</span><span>${esc(b.addr || '—')}</span><span>Telefon</span><span>${esc(b.phone || '—')}</span><span>Telegram</span><span>${esc(b.tg || '—')}</span><span>Ish vaqti</span><span>${esc(b.hours || '—')}</span></div></div>`).join('')}</div>
  <section class="newbox"><h3>${bEdit ? 'Filialni tahrirlash' : 'Yangi filial'}</h3>
    ${BF.map(([k, l, ph, t]) => `<label class="fl">${l}<input data-bf="${k}" type="${t}" placeholder="${ph}" value="${esc(cur[k] || '')}"></label>`).join('')}
    <button class="go" id="bsave">${bEdit ? 'Saqlash' : '+ Filial qo‘shish'}</button></section>`;
  document.querySelectorAll('[data-be]').forEach(el => el.onclick = () => { bEdit = +el.dataset.be; branchesAdmin(); window.scrollTo(0, document.body.scrollHeight); });
  document.querySelectorAll('[data-bd]').forEach(el => el.onclick = () => {
    const go = ok => ok && saveBranches(BR().filter(b => b.id !== +el.dataset.bd));
    tg && tg.showConfirm ? tg.showConfirm('Filial o‘chirilsinmi?', go) : go(confirm('O‘chirilsinmi?'));
  });
  $('#bsave').onclick = () => {
    const v = {}; document.querySelectorAll('[data-bf]').forEach(el => v[el.dataset.bf] = el.value.trim());
    if (!v.name) return toast('Filial nomini yozing');
    const list = bEdit ? BR().map(b => b.id === bEdit ? {...b, ...v} : b) : [...BR(), {id: Date.now(), ...v}];
    saveBranches(list);
  };
  tg && tg.BackButton.hide();
}
async function saveBranches(list) {
  try { await call('/api/branches', {branches: list}); D.branches = list; bEdit = null; toast('✅ Saqlandi'); branchesAdmin(); }
  catch (e) { toast('Xato: ' + e.message, 4000); }
}

function route() {
  const h = location.hash;
  if (h === '#catalog') return catalog();
  if (h === '#sale') return sales();
  if (h === '#contact') return contact();
  if (h === '#branches') return branchesAdmin();
  if (h === '#admin') return adminList();
  if (h === '#settings') return settings();
  if (h === '#new') return edit(null);
  let m = h.match(/edit=(\d+)/); if (m) return edit(m[1]);
  m = h.match(/p=(\d+)/);
  m ? product(m[1]) : home();
}

(async () => {
  try { D = await getData(); } catch (e) {}
  D.products = (D.products || []).filter(p => p.id);
  if (INIT) { try { ADMIN = (await call('/api/me')).admin; } catch (e) {} }
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && /^p_\d+$/.test(sp)) location.hash = 'p=' + sp.slice(2);
  window.onhashchange = route;
  route();
  setInterval(() => { if ($('#slides')) slide((bi + 1) % BANNERS.length, true); }, 4000);   // только сдвиг, без перерисовки
})();
</script>
