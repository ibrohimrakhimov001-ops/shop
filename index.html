<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Android Kokand</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--acc:#15803D;--acc2:#166534;--ink:#1B2326;--mut:#5C676B;--line:#E5EAE7;--soft:#F2F5F3;--mint:#E3F1E8;--red:#DC2626;--grad:linear-gradient(135deg,#178A45,#14532D)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#E6F5EA 0,#fff 300px) no-repeat;min-height:100vh;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
input,select{font-size:16px}   /* <16px → телефон приближает страницу */
#app{min-height:100vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.kb .bar,.kb .tabbar,.kb .savebar{display:none}
/* общие */
.hdr{display:flex;align-items:center;gap:12px;padding:20px 20px 12px}
.hdr h2{margin:0;font-size:22px;font-weight:800}
.hdr .sub2{font-size:12px;color:var(--mut);font-weight:600}
.ib{width:44px;height:44px;border-radius:14px;background:#fff;border:none;display:flex;align-items:center;justify-content:center;flex:none}
.ib.g{background:var(--soft)}
.sq{width:38px;height:38px;border-radius:11px;border:none;display:flex;align-items:center;justify-content:center;flex:none}
.sq.e{background:var(--mint)}.sq.o{background:#FFF4E5}.sq.d{background:#FDECEC}
.btn{height:56px;border-radius:16px;border:none;background:var(--grad);color:#fff;font-weight:800;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.6}
.sfx{position:relative;display:block}.sfx input{padding-right:60px}.sfx i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:15px;font-weight:700;color:var(--mut);pointer-events:none}
.cwrap{padding:4px 20px 120px;display:flex;flex-direction:column;gap:14px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 4px 14px rgba(21,128,61,.07)}
.ch{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;margin-bottom:6px}
.ci{width:32px;height:32px;border-radius:10px;background:#E8F5EC;display:flex;align-items:center;justify-content:center;flex:none}
.crow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.ch + .crow{border-top:none}.crow span{color:var(--mut);font-weight:600}.crow b{font-weight:800;color:var(--ink)}
#cres{display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--mut);min-width:0}
.fl input,.fl select{height:48px;border-radius:14px;border:1px solid #DDE3DF;background:#fff;padding:0 14px;font-size:16px;font-weight:600;color:var(--ink);width:100%;min-width:0;outline:none}
.fl select{padding:0 10px}
.fl textarea{border-radius:14px;border:1px solid #DDE3DF;background:#fff;padding:12px 14px;font:inherit;font-size:15px;font-weight:500;color:var(--ink);width:100%;outline:none;resize:vertical;line-height:1.45}
.fl textarea:focus{border-color:var(--acc)}
.wacts{display:flex;gap:6px;margin-top:6px}
.wacts button{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--ink)}
.wacts button.d{color:#B91C1C;border-color:#F5C2C2}
.fl input:focus,.fl select:focus{border-color:var(--acc)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:4px;background:var(--soft);border-radius:12px}
.seg button{height:40px;border-radius:9px;border:none;background:transparent;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;font-weight:700;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chk{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700}
.chk input{width:22px;height:22px;accent-color:var(--acc);margin:0}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0;font-weight:600}
.toast{position:fixed;left:20px;right:20px;bottom:96px;background:#1B2326;color:#fff;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;text-align:center;max-width:520px;margin:0 auto}
/* главная */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 14px;background:radial-gradient(120% 90% at 85% 0,#E3F1E8 0,transparent 60%)}
.logo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.brand{font-size:clamp(21px,6.2vw,32px);font-weight:900;letter-spacing:-1px;line-height:1.05;color:var(--ink);white-space:nowrap}.brand em{font-style:normal;color:var(--acc)}
.slog{font-size:14px;font-weight:600;color:var(--mut)}
.slog u{text-decoration:none;position:relative;display:inline-block}
.slog u svg{position:absolute;left:0;right:0;bottom:-5px;width:100%;height:7px;fill:none;stroke:#22A55A;stroke-width:2.4;stroke-linecap:round}
.hr{display:flex;align-items:center;gap:8px;flex:none}
.brsel{position:relative;display:flex;align-items:center;gap:6px;height:42px;padding:0 10px;border-radius:14px;background:var(--mint);font-size:14px;font-weight:700;color:var(--ink);max-width:140px}
.brsel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brsel svg{flex:none}
.brsel select{position:absolute;inset:0;opacity:0}
header.a .brand{font-size:clamp(19px,5.4vw,32px)}header.a .hr{gap:6px}header.a .brsel{font-size:13px;gap:5px}
@media(max-width:400px){header.a .brsel > svg:nth-of-type(2){display:none}}
.adm{width:42px;height:42px;border-radius:14px;background:#1B2326;border:none;display:flex;align-items:center;justify-content:center;flex:none}
.search{display:flex;gap:10px;margin:0 20px 14px}
.search label{min-width:0;display:flex;align-items:center;gap:12px;flex:1;height:56px;padding:0 18px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(27,35,38,.07)}
.search input{border:none;background:transparent;font-weight:500;font-size:16px;flex:1;min-width:0;outline:none}
.fbtn{width:56px;height:56px;border-radius:18px;border:none;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none}
.sortrow{display:flex;gap:6px;margin:-4px 20px 12px;flex-wrap:wrap}
.sortrow button{height:36px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.sortrow button.on{border-color:var(--acc);color:var(--acc2);background:var(--mint)}
.vp{overflow:hidden;margin:0 20px;border-radius:26px;touch-action:pan-y;box-shadow:0 8px 20px -10px rgba(5,46,22,.4);transform:translateZ(0)}
.slides{display:flex;transition:transform .6s cubic-bezier(.65,0,.2,1);will-change:transform}
.banner{position:relative;flex:none;width:100%;height:176px;overflow:hidden;color:#fff;padding:18px 20px 16px;display:flex;flex-direction:column;justify-content:space-between;border:none;text-align:left;font:inherit;isolation:isolate}
.banner .tx{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;max-width:205px}
.banner .tag{align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px}
.banner .t{font-size:22px;font-weight:800;line-height:1.12;letter-spacing:-.3px}
.banner .more{position:relative;z-index:1;align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#14532D;background:#fff;
  padding:6px 6px 6px 14px;border-radius:20px;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
.banner .more i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#15803D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.banner img{position:absolute;right:0;top:0;width:58%;height:100%;object-fit:cover;z-index:0;transform-origin:70% 50%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 22%,#000 48%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 22%,#000 48%)}
.banner.on img{animation:kb 7s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.banner img.full{width:100%;-webkit-mask-image:none;mask-image:none}
.banner svg.deco{position:absolute;right:-6px;bottom:-16px;opacity:.15;z-index:0}
.dots{display:flex;justify-content:center;gap:6px;padding-top:12px}
.dots button{height:6px;width:6px;border-radius:3px;border:none;padding:0;background:#CBD5CF;position:relative;overflow:hidden;transition:width .35s cubic-bezier(.4,0,.2,1)}
.dots button.on{width:28px;background:#D1E7DA}
.dots button.on::after{content:"";position:absolute;inset:0;background:#15803D;border-radius:3px;transform-origin:left;animation:dfill 4s linear forwards}
@keyframes dfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cats{display:flex;gap:8px;padding:12px 20px 4px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:12px;border:none;background:var(--soft);font-size:13px;font-weight:600;white-space:nowrap}
.cats button.on{background:var(--acc);color:#fff;font-weight:700}
.cats button.sale{background:#FDECEC;color:#B91C1C;font-weight:700}
.cats button.sale.on{background:var(--red);color:#fff}
.sk{background:linear-gradient(90deg,#E8F0EB 25%,#F6FAF7 45%,#E8F0EB 65%);background-size:300% 100%;animation:sk 1.2s ease-in-out infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
.skw{padding:18px 20px 0}.skc{gap:8px;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:10px 20px 14px}
.card{background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(21,128,61,.07);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;color:var(--ink);text-align:left;font:inherit}
.ph{position:relative;height:128px;border-radius:12px;background:linear-gradient(160deg,#F2F8F4,#DCEFE2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px}
.card .n{font-size:14px;font-weight:700;line-height:1.2}
.card .s{font-size:12px;color:var(--mut);font-weight:600}
.card .br{font-size:11px;color:var(--acc2);font-weight:700}
.card .pr{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.card .p{font-size:16px;font-weight:800}
.old{font-size:12px;color:var(--mut);text-decoration:line-through;font-weight:600}
.card.sold{opacity:.6}.card.sold img{filter:grayscale(1)}
.newtag{position:absolute;top:8px;right:8px;background:#15803D;color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;box-shadow:0 2px 6px rgba(21,128,61,.3)}
.soldtag{position:absolute;inset:auto 8px 8px 8px;background:rgba(27,35,38,.85);color:#fff;font-size:12px;font-weight:800;text-align:center;padding:5px;border-radius:8px}
.tabbar{position:sticky;bottom:0;z-index:10;margin-top:auto;display:flex;justify-content:space-around;padding:10px 12px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;font-size:11px;font-weight:600;color:var(--mut);min-width:0;flex:1;padding:2px 0}
.tabbar button.on{color:var(--acc);font-weight:700}
/* карточка товара */
.gal{position:relative;height:340px;background:linear-gradient(160deg,#F2F8F4,#D6EDDD);flex:none}
.gal .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .track::-webkit-scrollbar{display:none}
.gal .track > *{flex:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center}
.gal img{width:100%;height:100%;object-fit:contain}
.gal .pv{position:relative}.gal .pv img{position:absolute;inset:0}.gal .lo{filter:blur(4px)}.gal .hi{opacity:0;transition:opacity .3s}.gal .hi.ok{opacity:1}
.gal .back{position:absolute;top:16px;left:16px;width:44px;height:44px;border-radius:14px;background:#fff;border:none;display:flex;align-items:center;justify-content:center;z-index:2}
.gal .gd{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gal .gd span{width:6px;height:6px;border-radius:3px;background:#CBD5CF;transition:all .3s}
.gal .gd span.on{width:20px;background:var(--acc)}
.pbody{display:flex;flex-direction:column;gap:14px;padding:18px 20px 24px}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.15}
.big{font-size:30px;font-weight:800;color:var(--acc)}
.fromm{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:14px;background:var(--mint);color:var(--acc2);border:none;text-align:left;width:100%;font:inherit}
.fromm .go{display:flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:10px;background:var(--grad);color:#fff;font-size:13px;font-weight:800;flex:none}
.specs{display:flex;flex-direction:column;background:var(--soft);border-radius:18px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #E0E7E2;font-size:15px}
.row:last-child{border-bottom:none}
.ic{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.row .k{color:var(--mut);font-weight:600;flex:1}.row .v{font-weight:800}
.loc{display:flex;align-items:flex-start;gap:12px;padding:4px 2px}
.calc{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:18px;padding:14px;scroll-margin-top:12px}
.calc .seg{background:#fff}
.calc .seg button.on{background:var(--grad);color:#fff;font-weight:800}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.terms button{height:44px;border-radius:12px;border:2px solid #fff;background:#fff;font-weight:800;font-size:14px}
.terms button.on{border-color:var(--acc);color:var(--acc2)}
.terms button.dis{color:#A3ADA9}
.warn{display:flex;gap:8px;align-items:center;background:#FFF4E5;color:#92400E;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.35}
.warn button{border:none;background:#92400E;color:#fff;border-radius:8px;height:34px;padding:0 12px;font-weight:800;font-size:12px;flex:none}
.down{display:flex;align-items:center;gap:8px;height:48px;border-radius:12px;background:#fff;padding:0 12px;font-size:13px;font-weight:600;color:var(--mut)}
.down input{flex:1;min-width:0;border:none;outline:none;background:transparent;text-align:right;font-weight:700;color:var(--ink)}
.res{display:flex;align-items:center;justify-content:space-between;background:var(--grad);color:#fff;border-radius:12px;padding:10px 14px}
.desc{white-space:pre-wrap;font-size:14px;line-height:1.5;color:var(--mut);font-weight:600}
.soldbig{background:#1B2326;color:#fff;font-weight:800;text-align:center;padding:12px;border-radius:14px;font-size:16px}
.bar{position:sticky;bottom:0;z-index:10;margin-top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.bar a,.bacts a{text-decoration:none}
.bar a,.bar button{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;white-space:nowrap;border:none}
.bar .call{background:var(--grad);color:#fff}
.bar .tgb{background:#fff;border:2px solid var(--acc);color:var(--acc)}
/* aloqa / filiallar */
.asub{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:10px 4px 0}
.list{display:flex;flex-direction:column;gap:10px;padding:4px 20px 16px}
.bcard{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(21,128,61,.06)}
.bhead{display:flex;align-items:center;gap:10px}
.bnum{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.binfo{display:grid;grid-template-columns:74px minmax(0,1fr);gap:6px 8px;font-size:13px;font-weight:700;background:var(--soft);border-radius:12px;padding:10px 12px}
.binfo span:nth-child(odd){color:var(--mut);font-weight:600}
.bacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bacts a,.bacts button{height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:none}
.bacts .c{background:var(--grad);color:#fff}.bacts .t{background:#fff;border:2px solid var(--acc);color:var(--acc)}
.newbox{display:flex;flex-direction:column;gap:12px;margin:8px 20px 24px;padding:16px;border-radius:18px;background:#fff;border:2px dashed #CBD5CF}
.newbox.solid{border:2px solid var(--line)}
.newbox h3{margin:0;font-size:17px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:4px 20px 24px}
.tiles button{height:110px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,#F2F8F4,#DCEFE2);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:14px;gap:2px;text-align:left}
.tiles .tl{margin-bottom:auto;display:flex;color:var(--ink,#1B2326)}.lg{flex:none;display:block}
.tiles b{font-size:17px;font-weight:800}.tiles span{font-size:12px;font-weight:600;color:var(--mut)}
/* админ */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 20px 12px}
.stats div{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.stats b{font-size:20px;font-weight:800}.stats span{font-size:11px;font-weight:600}
.anav{display:flex;gap:6px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
.anav::-webkit-scrollbar{display:none}
.anav button{padding:9px 14px;border-radius:12px;border:none;background:var(--soft);font-size:13px;font-weight:600;white-space:nowrap}
.anav button.on{background:var(--grad);color:#fff;font-weight:700}
.arow{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:10px}
.arow .th{position:relative;width:56px;height:56px;border-radius:12px;background:#fff;flex:none}
.arow .th img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.arow .th .bd{position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px}
.arow .inf{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.arow .inf b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .inf span{font-size:12px;color:var(--mut);font-weight:600}
.soldb{align-self:flex-start;margin-top:4px;height:30px;padding:0 10px;border-radius:9px;border:1.5px solid #F5C2C2;background:#fff;color:#B91C1C;font-size:12px;font-weight:800}
.soldb.on{background:#1B2326;border-color:#1B2326;color:#fff}
.soldb:disabled{opacity:.5}
.phs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.phs .pi{position:relative;height:96px;border-radius:14px;background:var(--soft);overflow:hidden}
.phs .pi img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
.phs .pi .main{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:800;color:#fff;background:var(--acc);padding:2px 6px;border-radius:5px}

function eff(p) {   // итоговая цена: своя скидка товара → иначе активная акция
  const ownOn = p.sale && p.old && !(p.sale_until && today() > p.sale_until);

  const base = p.sale && p.old ? p.old : p.price;   // своя скидка истекла

/* ---------- API на телефоне (через туннель) ---------- */
async function apiUrl(force) {
  if (!APIURL && !force) { try { APIURL = localStorage.getItem('api') || ''; } catch (e) {} }
  if (APIURL && !force) return APIURL;
  const r = await fetch(PAGES + 'api.json?t=' + Date.now(), {cache: 'no-store'});
  APIURL = (await r.json()).api;
  try { localStorage.setItem('api', APIURL); } catch (e) {}
  return APIURL;
}
async function phoneProducts(base) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 5000);
  try { const r = await fetch(base + '/api/products', {cache: 'no-store', signal: c.signal}); if (r.ok) return await r.json(); }
  catch (e) {} finally { clearTimeout(t); }
  return null;
}
async function call(path, body, retry = true) {
  try {
    const r = await fetch(await apiUrl() + path, {method: body ? 'POST' : 'GET', headers: {'X-Init-Data': INIT, 'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
  } catch (e) { if (retry) { await apiUrl(true); return call(path, body, false); } throw e; }
}

let lastTouch = 0;
function dots() {
  $$('[data-b]').forEach((el, k) => { el.classList.remove('on'); if (k === bi) { el.offsetWidth; el.classList.add('on'); } });
  $$('.banner').forEach((el, k) => { el.classList.remove('on'); if (k === bi) { el.offsetWidth; el.classList.add('on'); } });
}
function slide(k, auto) {
  const sl = $('#slides'); if (!sl) return;
  if (auto && Date.now() - lastTouch < 6000) return;
  if (!auto) lastTouch = Date.now();
  bi = k; sl.style.transform = `translateX(${-k * 100}%)`; dots();
}

const priceSum = p => eff(p).price * D.kurs * 1.01;
function monthly(p, m, r = rasmiy, d = down) {
  const R = RATES(), k = r ? {3: R.r3, 6: R.r6, 12: R.r12}[m] : (m === 12 ? R.n12 : null);
  return k == null ? 0 : up(Math.max(0, priceSum(p) - d) * (1 + k / 100) / m);
}

function calcPage() {   // как в боте @Androidkokandbot: ISHONCH (narx×1.01) и BIRZUM NASIYA (narx×1.02), минус предоплата

  const head = (ic, t) => `<div class="ch"><span class="ci">${svg(IC[ic], '#15803D', 18)}</span>${t}</div>`;
  const tbl = (base, rows) => rows.map(([oy, pct]) => `<div class="crow"><span>${oy} oy</span><b>${fmt(base * (1 + pct / 100) / oy)} so‘m</b></div>`).join('');

    const usd = parseFloat(inp.value.replace(/\s/g, '').replace(',', '.').replace('$', ''));

    if (ish <= 0) { out.innerHTML = '<div class="empty">Oldindan to‘lov telefon narxidan katta</div>'; return; }
    out.innerHTML = `<div class="ccard">${head('bank', 'ISHONCH · Rasmiy')}${tbl(ish, [[3, R.r3], [6, R.r6], [12, R.r12]])}</div>

  draw();
}

function shrink(file, max = 1280) {
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src); ok(c.toDataURL('image/jpeg', 0.82)); };
    im.onerror = bad; im.src = URL.createObjectURL(file); });
}
async function saveForm() {
  if (!F.name.trim()) return toast('Model nomini yozing');
  if (BR().length && !F.branch) return toast('Filialni tanlang');
  if (!F.id && !F.neu.length) return toast('Kamida 1 ta rasm qo‘shing');
  const orig = +F.price || 0;
  let price = orig, old = '', sale = '', until = '';
  if (F.disc && orig) {
    const np = +F.newp || (F.pct ? Math.round(orig * (1 - F.pct / 100)) : 0);
    if (!np || np >= orig) return toast('Chegirmani to‘g‘ri kiriting');
    price = np; old = orig; sale = '−' + Math.round((1 - np / orig) * 100) + '%'; until = F.until;
  }
  const fields = {name: F.name.trim(), brand: F.brand, memory: F.memory, state: F.state, warranty: F.warranty, battery: F.battery ? F.battery + '%' : '',
    box: F.box, price, old, sale, sale_until: until, branch: F.branch};
  const b = $('#sv'); b.disabled = true; b.textContent = 'Saqlanmoqda…';
  try {
    const j = await call('/api/save', {id: F.id, fields, keep: F.keep, new_photos: F.neu});
    const pid = j.id, was = F.id ? D.products.find(x => x.id === F.id) : null;
    (j.photos || []).filter(x => !F.keep.includes(x)).forEach((x, i) => { if (F.neu[i]) LOCAL[x] = F.neu[i]; });
    if ((was ? !was.sold : true) !== F.instock) await call('/api/sold', {id: pid, sold: !F.instock});
    toast(F.id || D.post === false ? '✅ Saqlandi' : '✅ Saqlandi va kanalga joylandi'); j.warn && toast(j.warn, 4000);
    F = null; setTimeout(async () => { await refresh(); location.hash = 'admin'; route(); }, 1200);
  } catch (e) { b.disabled = false; b.textContent = 'Qayta urinish'; toast('Xato: ' + e.message, 4000); }
}

  const keep = () => { BN.title = $('#bt').value; BN.tag = $('#bg').value; BN.text = $('#btx').checked; const l = $('#bl').value; BN.link = l === 'p' ? 'p:' + ($('#blp') ? $('#blp').value : (D.products[0] || {}).id) : l; };
  $('#bl').onchange = () => { keep(); bannersAdmin(); };
  $('#bf').onchange = async e => { keep(); if (e.target.files[0]) BN.new_img = await shrink(e.target.files[0], 1200); bannersAdmin(); };
  $$('[data-bu]').forEach(el => el.onclick = () => { const i = +el.dataset.bu; if (!i) return; const l = [...list]; [l[i - 1], l[i]] = [l[i], l[i - 1]]; saveBanners(l); });
  $$('[data-bd]').forEach(el => el.onclick = () => confirmDo('Banner o‘chirilsinmi?', () => saveBanners(list.filter((_, i) => i !== +el.dataset.bd))));
  $('#bsv').onclick = () => {
    keep();
    if (!BN.new_img && !BN.title) return toast('Rasm yoki sarlavha qo‘shing');
    saveBanners([...list, {...BN}]);
  };
}
async function saveBanners(list) {
  const b = $('#bsv'); if (b) { b.disabled = true; b.textContent = 'Saqlanmoqda…'; }
  try {
    const j = await call('/api/banners', {banners: list});
    const had = new Set((D.banners || []).map(b => b.img));
    const fresh = list.filter(b => b.new_img), added = j.banners.filter(b => b.img && !had.has(b.img));
    added.forEach((b, i) => { if (fresh[i]) LOCAL[b.img] = fresh[i].new_img; });
    D.banners = j.banners; BN = null; bi = 0; toast('✅ Saqlandi'); bannersAdmin(); }
  catch (e) { toast('Xato: ' + e.message, 4000); if (b) { b.disabled = false; b.textContent = 'Bannerni saqlash'; } }
}

/* --- filiallar --- */
const BF = [['name', 'Nomi', 'Masalan: Markaz filiali', 'text'], ['addr', 'Manzil', 'Qo‘qon shahar, ...', 'text'], ['phone', 'Telefon raqami', '+998 __ ___ __ __', 'tel'], ['tg', 'Telegram', '@username', 'text'], ['hours', 'Ish vaqti', 'Har kuni 9:00–21:00', 'text']];

  <div class="list">${BR().map((b, i) => `<div class="bcard"><div class="bhead"><span class="bnum">${i + 1}</span>

    <div class="binfo"><span>Manzil</span><span>${esc(b.addr || '—')}</span><span>Telefon</span><span>${esc(b.phone || '—')}</span><span>Telegram</span><span>${esc(b.tg || '—')}</span><span>Ish vaqti</span><span>${esc(b.hours || '—')}</span></div></div>`).join('')}</div>
  <section class="newbox"><h3>${bEdit ? 'Filialni tahrirlash' : 'Yangi filial'}</h3>

  $$('[data-be]').forEach(el => el.onclick = () => { bEdit = +el.dataset.be; branchesAdmin(); scrollTo(0, document.body.scrollHeight); });

  $('#bsave').onclick = () => {

async function saveBranches(list) {
  try { await call('/api/branches', {branches: list}); D.branches = list; bEdit = null; toast('✅ Saqlandi'); branchesAdmin(); }
  catch (e) { toast('Xato: ' + e.message, 4000); }
}

/* --- kafolat --- */
let WL = null;
const dmy = t => { const d = new Date(t * 1000); return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear(); };
function wst(it) {
  const over = it.ended || Date.now() / 1000 >= it.end;
  if (over) return it.agreed ? ['Tugagan', '#5C676B', '#EEF1EF'] : ['Rozi bo‘lmagan', '#B91C1C', '#FDECEC'];
  return it.agreed ? ['Faol · ' + dmy(it.end) + ' gacha', '#15803D', '#E3F1E8'] : ['Rozilik kutilmoqda', '#B45309', '#FEF3E2'];
}
let WQ = '';
function wRows() {
  if (!WL) return '<span style="font-size:13px;color:var(--mut);font-weight:600">Yuklanmoqda…</span>';
  const q = WQ.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  const list = !q ? WL : WL.filter(it => (it.name + ' ' + it.model).toLowerCase().includes(q)
    || (qd.length >= 3 && (String(it.imei).includes(qd) || String(it.no || it.client).includes(qd) || String(it.phone || '').includes(qd))));
  if (!list.length) return `<div class="empty" style="padding:20px 0">${q ? 'Hech narsa topilmadi' : 'Amaldagi kafolat yo‘q'}</div>`;
  return list.map(it => { const [t, c, bg] = wst(it); return `<div class="pcard" style="gap:4px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="font-size:15px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.model)}</span>
    <span style="flex:none;font-size:11px;font-weight:800;color:${c};background:${bg};padding:4px 8px;border-radius:8px">${t}</span></div>
    <span style="font-size:13px;font-weight:600">${esc(it.name)} · № ${esc(it.no || it.client)}${it.phone ? ' · +' + esc(it.phone) : ''}</span>
    <span style="font-size:12px;font-weight:600;color:var(--mut)">IMEI ${esc(it.imei)} · sotib olingan ${esc(it.date)} · yuborilgan ${dmy(it.sent)}</span>
    <div class="wacts"><button data-we="${it.wid}">Tahrirlash</button>${it.ended || Date.now() / 1000 >= it.end ? '' : `<button data-wt="${it.wid}">Hozir tugatish</button>`}<button class="d" data-wd="${it.wid}">O‘chirish</button></div></div>`; }).join('');
}
function warranty() {
  if (!guard()) return;
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  page(`<div class="hdr">${backBtn('admin')}<h2>Kafolat</h2></div>
  ${anav('warranty')}
  <div style="display:flex;flex-direction:column;gap:12px;padding:4px 20px 16px">
    <label class="fl">Mijoz ID yoki telefon raqami<input id="w_c" inputmode="numeric" placeholder="12345 yoki 90 123 45 67" autocomplete="off"></label>
    <span style="font-size:12px;font-weight:600;color:var(--mut);margin-top:-6px">Mijozda ID bo‘lmasa: botga /id yuborib, raqamini jo‘natsin — bot 5 xonali ID beradi.</span>
    <label class="fl">Ism<input id="w_n" placeholder="Mijoz ismi" autocomplete="off"></label>
    <label class="fl">Model<input id="w_m" placeholder="iPhone 13 128GB" autocomplete="off"></label>
    <label class="fl">IMEI<input id="w_i" inputmode="numeric" placeholder="15 xonali raqam" autocomplete="off"></label>
    <label class="fl">Sotib olingan sana<input id="w_d" type="date" value="${today}"></label>
    <button class="btn" id="w_go">🛡 Kafolat yuborish</button>
    <button class="dash" id="w_cancel" style="width:100%;display:none">Tahrirlashni bekor qilish</button>
    <span class="lbl">Amaldagi kafolatlar</span>
    <div class="search" style="margin:0"><label style="height:48px">${svg('<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path>', '#1B2326', 20, 2.2)}
      <input id="w_q" type="search" placeholder="Ism, model, IMEI, talon № yoki telefon" aria-label="Kafolatni qidirish" autocomplete="off"></label></div>
    <div class="list" id="wl" style="padding:0">${wRows()}</div>
  </div>`);
  let ED = 0;   // wid редактируемой гарантии
  const go = $('#w_go'), cancel = $('#w_cancel');
  const resetForm = () => { ED = 0; ['#w_c', '#w_n', '#w_m', '#w_i'].forEach(x => $(x).value = ''); $('#w_c').disabled = false; $('#w_d').value = today;
    go.textContent = '🛡 Kafolat yuborish'; cancel.style.display = 'none'; };
  const act = async (path, wid, ok) => { try { const j = await call(path, {wid}); toast(ok); j.warn && toast(j.warn, 5000); reload(); } catch (e) { toast('Xato: ' + e.message, 5000); } };
  const bindW = () => {
    $$('[data-we]').forEach(el => el.onclick = () => { const it = WL.find(x => x.wid === +el.dataset.we); if (!it) return;
      ED = it.wid; $('#w_c').value = it.client; $('#w_c').disabled = true; $('#w_n').value = it.name; $('#w_m').value = it.model; $('#w_i').value = it.imei;
      const [d, m, y] = (it.date || '').split('.'); $('#w_d').value = y ? `${y}-${m}-${d}` : today;
      go.textContent = '💾 O‘zgarishni saqlash'; cancel.style.display = ''; window.scrollTo({top: 0, behavior: 'smooth'}); });
    $$('[data-wt]').forEach(el => el.onclick = () => confirmDo('Kafolat hozir tugatilsinmi? Mijozga tugash haqida xabar boradi.', () => act('/api/wend', +el.dataset.wt, '⌛️ Kafolat tugatildi va o‘chirildi')));
    $$('[data-wd]').forEach(el => el.onclick = () => confirmDo('Kafolat o‘chirilsinmi? Mijozga bekor qilingani haqida xabar boradi.', () => act('/api/wdel', +el.dataset.wd, '🗑 Kafolat o‘chirildi')));
  };
  const reload = () => call('/api/warranty').then(j => { WL = j.items; if ($('#wl')) { $('#wl').innerHTML = wRows(); bindW(); } }).catch(e => toast('Xato: ' + e.message));
  reload();
  WQ = ''; $('#w_q').oninput = e => { WQ = e.target.value; $('#wl').innerHTML = wRows(); bindW(); };
  cancel.onclick = resetForm;
  go.onclick = async () => {
    const b = {client: $('#w_c').value, name: $('#w_n').value, model: $('#w_m').value, imei: $('#w_i').value, date: $('#w_d').value};
    if (!b.client.trim() || !b.name.trim() || !b.model.trim() || !b.imei.trim()) return toast('Barcha maydonlarni to‘ldiring');
    const label = go.textContent; go.disabled = true; go.textContent = 'Yuborilmoqda…';
    try {
      if (ED) { const j = await call('/api/wedit', {wid: ED, ...b}); toast('✅ O‘zgartirildi, mijozga xabar yuborildi'); j.warn && toast(j.warn, 5000); }
      else { await call('/api/warranty', b); toast('✅ Kafolat mijozga yuborildi'); }
      go.disabled = false; resetForm(); reload();
    } catch (e) { toast('Xato: ' + e.message, 5000); go.disabled = false; go.textContent = label; }
  };
}

/* --- sozlamalar --- */
let ADM = null;
function settings() {
  if (!guard()) return;
  const R = RATES();
  page(`<div class="hdr">${backBtn('admin')}<h2>Sozlamalar</h2></div>
  ${anav('settings')}
  <div style="display:flex;flex-direction:column;gap:12px;padding:4px 20px 16px">
    <button class="navcard" data-go="branches"><span class="ico">${svg(P.pin, '#fff')}</span>
      <span style="display:flex;flex-direction:column;flex:1"><span style="font-size:15px;font-weight:800">Filiallar</span><span style="font-size:12px;font-weight:600;color:var(--mut)">${BR().length} ta filial · manzil, telefon, Telegram</span></span>${svg(P.chev, '#5C676B', 18)}</button>
    <span class="lbl">Telegram kanal</span>
    <label class="chk">Yangi mahsulotni kanalga joylash<input type="checkbox" id="s_post" ${D.post !== false ? 'checked' : ''}></label>
    <span class="lbl">Muddatli to‘lov</span>
    <label class="fl">Dollar kursi, so‘m<input id="s_kurs" inputmode="numeric" placeholder="12 800" value="${D.kurs || ''}"></label>
    <span style="font-size:12px;font-weight:700;color:var(--mut)">Ustama · rasmiy ish joyi</span>
    <div class="g3">${[3, 6, 12].map(m => `<label class="fl">${m} oy, %<input data-rt="r${m}" inputmode="numeric" value="${R['r' + m]}"></label>`).join('')}</div>
    <span style="font-size:12px;font-weight:700;color:var(--mut)">Ustama · norasmiy</span>
    <div class="g3"><label class="fl">12 oy, %<input data-rt="n12" inputmode="numeric" value="${R.n12}"></label></div>
    <span class="lbl">Kafolat shartlari</span>
    <label class="fl">Mijozga yuboriladigan matn<textarea id="s_terms" rows="8" placeholder="Yuklanmoqda…"></textarea></label>
    <button class="dash" id="s_tsv" style="width:100%">Kafolat shartlarini saqlash</button>
    <span class="lbl">Adminlar</span>
    <div id="adl" style="display:flex;flex-direction:column;gap:8px">${ADM ? '' : '<span style="font-size:13px;color:var(--mut);font-weight:600">Yuklanmoqda…</span>'}</div>
    <div id="adadd"><button class="dash" id="adb" style="width:100%">+ Telegram ID orqali admin qo‘shish</button></div>
  </div>
  <div class="savebar" style="border-top:none"><button class="btn" id="ssv">Saqlash</button></div>`);
  const drawAdm = () => { $('#adl').innerHTML = (ADM || []).map((a, i) => `<div class="adrow"><span class="av">${i ? 'A' : '★'}</span><span style="flex:1;font-size:14px;font-weight:700">${a}${i ? '' : ' <span style="font-weight:600;color:var(--mut)">· asosiy</span>'}</span>${i ? `<button class="sq d" aria-label="Adminni o‘chirish" data-ar="${a}">${svg(P.del, '#B91C1C', 17)}</button>` : ''}</div>`).join('');
    $$('[data-ar]').forEach(el => el.onclick = () => confirmDo('Admin o‘chirilsinmi?', async () => { try { ADM = (await call('/api/admins', {remove: +el.dataset.ar})).admins; drawAdm(); } catch (e) { toast('Xato: ' + e.message); } })); };
  if (ADM) drawAdm(); else call('/api/admins').then(j => { ADM = j.admins; if ($('#adl')) drawAdm(); }).catch(() => {});
  $('#adb').onclick = () => {
    $('#adadd').innerHTML = `<div style="display:flex;gap:8px"><label class="fl" style="flex:1"><input id="adid" inputmode="numeric" placeholder="Telegram ID, masalan 123456789" aria-label="Telegram ID"></label><button class="btn" id="adok" style="width:90px;height:48px;border-radius:14px">Qo‘shish</button></div>`;
    $('#adid').focus();
    $('#adok').onclick = async () => { const v = +$('#adid').value.replace(/\D/g, ''); if (!v) return toast('ID ni yozing');
      try { ADM = (await call('/api/admins', {add: v})).admins; toast('✅ Admin qo‘shildi'); settings(); } catch (e) { toast('Xato: ' + e.message); } };
  };
  $('#s_post').onchange = async e => { const v = e.target.checked;
    try { await call('/api/settings', {post: v}); D.post = v; toast(v ? '✅ Kanalga joylash yoqildi' : '⏸ Kanalga joylash o‘chirildi'); }
    catch (er) { e.target.checked = !v; toast('Xato: ' + er.message, 4000); } };
  call('/api/warranty').then(j => { WL = j.items; if ($('#s_terms') && !$('#s_terms').value) $('#s_terms').value = j.terms; }).catch(() => {});
  $('#s_tsv').onclick = async () => { const t = $('#s_terms').value.trim(); if (!t) return toast('Matn bo‘sh');
    try { await call('/api/wterms', {terms: t}); toast('✅ Kafolat shartlari saqlandi'); } catch (e) { toast('Xato: ' + e.message, 4000); } };
  $('#ssv').onclick = async () => {
    const rates = {}; $$('[data-rt]').forEach(el => rates[el.dataset.rt] = +el.value || 0);
    const kurs = +$('#s_kurs').value.replace(/\D/g, '');
    if (!kurs) return toast('Kursni yozing');
    try { await call('/api/settings', {kurs, rates}); D.kurs = kurs; D.rates = rates; toast('✅ Saqlandi'); } catch (e) { toast('Xato: ' + e.message, 4000); }
  };
}

/* ================= маршруты ================= */
function route() {
  document.body.classList.remove('kb');
  const h = location.hash.replace(/^#/, '');
  const S = {catalog, calc: calcPage, sale: sales, contact, admin, promos, banners: bannersAdmin, branches: branchesAdmin, settings, warranty, new: () => edit(null)};
  if (S[h]) return S[h]();
  let m = h.match(/^edit=(\d+)(&d)?/); if (m) return edit(m[1], !!m[2]);
  m = h.match(/p=(\d+)/); m ? product(m[1]) : home();
}
function skeleton() {
  const c = '<div class="card skc"><div class="sk" style="height:128px"></div><div class="sk" style="height:14px;width:80%"></div><div class="sk" style="height:11px;width:60%"></div><div class="sk" style="height:16px;width:40%"></div></div>';
  $('#app').innerHTML = `<div class="skw"><div class="sk" style="height:12px;width:90px"></div><div class="sk" style="height:24px;width:170px;margin-top:8px"></div>
    <div class="sk" style="height:46px;margin-top:16px;border-radius:16px"></div><div class="sk" style="height:150px;margin-top:16px;border-radius:20px"></div>
    <div style="display:flex;gap:8px;margin-top:16px">${'<div class="sk" style="height:38px;width:84px;border-radius:19px"></div>'.repeat(3)}</div></div>
    <div class="grid">${c.repeat(6)}</div>`;
}
(async () => {
  skeleton();
  try { D = await getData(); } catch (e) {}
  norm();
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && /^p_\d+$/.test(sp)) location.hash = 'p=' + sp.slice(2);
  window.onhashchange = route;
  route();
  // статус админа: сразу из памяти (сервер всё равно проверяет), затем уточняем с повтором — туннель иногда моргает
  try { if (INIT && localStorage.getItem('adm') === '1') { ADMIN = true; route(); } } catch (e) {}
  const me = n => call('/api/me').then(j => { const a = !!j.admin; try { localStorage.setItem('adm', a ? '1' : '0'); } catch (e) {}
    if (a !== ADMIN) { ADMIN = a; route(); } }).catch(() => n > 0 && setTimeout(() => me(n - 1), 2500));
  if (INIT) me(4);
  setInterval(() => { if ($('#slides') && !document.body.classList.contains('kb')) slide((bi + 1) % banners().length, true); }, 4000);
})();
</script>
